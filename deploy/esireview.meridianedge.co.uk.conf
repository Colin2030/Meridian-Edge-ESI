# Meridian Edge ESI Review — custom-domain vhost
# Public URL: https://esireview.meridianedge.co.uk  ->  server_name esireview.meridianedge.co.uk
# Symlinked into /etc/nginx/conf.d/esireview.meridianedge.co.uk.conf
# NOTE: the $connection_upgrade map is defined once in meridian-edge.conf (shared http context) —
# do NOT redefine it here or nginx -t fails with "duplicate map".

server {
    listen 80;
    server_name esireview.meridianedge.co.uk;

    # ESI documents (TIFF/PDF pages) and full dataset deliveries can be very large.
    client_max_body_size 64g;

    # --- Marketing site at /esireview/ (static, served directly; app untouched at /) ---
    # ^~ gives this prefix priority over the catch-all "location /" proxy below, so these
    # static files are served from disk and never proxied to the app on :4100.
    location = /esireview { return 301 /esireview/; }
    location ^~ /esireview/ {
        alias /home/ubuntu/meridianedge-site/public/;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "max-age=0, s-maxage=60";
    }

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;

        # Custom domain: the real Host arrives unchanged, so pass $host straight through.
        proxy_set_header Host              $host;
        proxy_set_header X-Original-Host   $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Stream large upload bodies straight to the backend instead of buffering the
        # whole multi-GB request to a temp file first.
        proxy_request_buffering off;

        # Large deliveries take a long time to stream — raise upload timeouts.
        # (NOTE: the public *.abacusai.cloud edge/CDN may still cut connections
        # after ~300s; on a customer's own nginx there is no such cap.)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_body_timeout 3600s;
        add_header Cache-Control "max-age=0, s-maxage=60";
    }
}
