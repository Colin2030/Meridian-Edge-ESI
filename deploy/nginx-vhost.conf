# Meridian Edge — nginx reverse-proxy vhost (TEMPLATE)
#
# The Node server binds 127.0.0.1:4100 and serves BOTH the API (/api) and the built
# SPA. This vhost terminates the public connection and proxies everything through.
#
# Install:
#   sudo cp deploy/nginx-vhost.conf /etc/nginx/conf.d/meridian-edge.conf
#   # edit server_name below to the real hostname
#   sudo nginx -t && sudo systemctl reload nginx
#
# On the Abacus SuperComputer VM: name the vhost after the hostname and set
# server_name to "<subdomain>.vm.internal" (the VM forwards the public host in the
# X-Original-Host header, restored below). For a normal host, use the real FQDN.
#
# TLS: on the Abacus VM, TLS is terminated at the edge — keep "listen 80" only.
# On a self-hosted / air-gapped box, add a "listen 443 ssl" server block with your
# own certificate and redirect 80 -> 443.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    # Abacus VM:  server_name meridian-edge-xxxxxx.vm.internal;
    # Self-hosted: server_name review.example.gov.uk;
    server_name _;

    # ESI documents (TIFF/PDF pages) and full dataset deliveries can be very large.
    # On a customer's own nginx these settings allow multi-GB deliveries to be
    # received; set to 0 for no nginx-level body cap (disk space becomes the limit).
    # NOTE: if a CDN/edge sits in front of this nginx it may impose its own
    # connection time limit that these directives cannot override.
    client_max_body_size 64g;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;

        # Preserve the original public host so the app builds correct absolute URLs.
        proxy_set_header Host              $host;
        proxy_set_header X-Original-Host   $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket-safe (future-proofing; the PoC does not use WS yet).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Stream large upload bodies straight to the backend instead of buffering the
        # whole multi-GB request to a temp file first.
        proxy_request_buffering off;

        # Document rendering / large exports and deliveries can be slow — raise timeouts.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_body_timeout 3600s;

        # HTML is revalidated every load; hashed assets carry their own long cache.
        add_header Cache-Control "max-age=0, s-maxage=60";
    }
}

# NOTE on embedding / clickjacking:
# The app sends its own security headers via helmet, including
#   Content-Security-Policy: frame-ancestors 'self' https://*.abacus.ai
# and does NOT send X-Frame-Options, so it renders inside the Abacus preview iframe
# while staying protected elsewhere. Do not add `add_header X-Frame-Options ...` here.
