# Meridian Edge — LIVE nginx vhost for the Abacus SuperComputer VM
# Public URL: https://meridian-edge.abacusai.cloud  ->  server_name meridian-edge.vm.internal
# Symlinked into /etc/nginx/conf.d/meridian-edge.conf
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name meridian-edge.vm.internal;

    # ESI documents (TIFF/PDF pages) can be large.
    client_max_body_size 512m;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;

        # The VM forwards the real public host in X-Original-Host; pass it through as Host
        # so the app builds correct absolute URLs.
        proxy_set_header Host              $http_x_original_host;
        proxy_set_header X-Original-Host   $http_x_original_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 300s;
        add_header Cache-Control "max-age=0, s-maxage=60";
    }
}
